<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Create a DoJodi Events account to save services, request proposals and manage the planning of your event in one place.">
    <meta name="author" content="DoJodi Events">
    <meta name="theme-color" content="#5100ff">

    <title>Create an Account — DoJodi Events</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%235100ff'/%3E%3Ctext%20x='16'%20y='22'%20font-family='Arial,sans-serif'%20font-size='18'%20font-weight='bold'%20fill='%23fff'%20text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">

    <!-- CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/bootstrap-icons.css" rel="stylesheet">
    <link href="css/dojodi.css" rel="stylesheet">
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="preloader" role="status" aria-live="polite">
      <span class="visually-hidden">Loading…</span>
      <div class="spinner"><span class="sk-inner-circle"></span></div>
    </div>
    <div data-include="navbar"></div>

    <main id="main">
      <section class="sign-in-form section-padding">
        <div class="container">
          <div class="row">
            <div class="col-lg-8 mx-auto col-12">
              <h1 class="hero-title text-center mb-3">Create your account</h1>
              <p class="text-center mb-5">Save services, request proposals and plan your event in one place.</p>

              <div class="social-login d-flex flex-column w-50 m-auto">
                <a href="#" class="btn custom-btn social-btn mb-4">
                  <i class="bi bi-google me-3" aria-hidden="true"></i>
                  Continue with Google
                </a>
                <a href="#" class="btn custom-btn social-btn">
                  <i class="bi bi-facebook me-3" aria-hidden="true"></i>
                  Continue with Facebook
                </a>
              </div>

              <div class="div-separator w-50 m-auto my-5"><span>or</span></div>

              <div class="row">
                <div class="col-lg-8 col-11 mx-auto">
                  <form role="form" novalidate data-validate
                        data-success-title="Account created!"
                        data-success-message="This is a demo, so no account was actually created — but the form and its validation work.">
                    <div class="form-floating">
                      <input type="email" name="email" id="email" class="form-control" placeholder="Email address" required data-label="Email address">
                      <label for="email">Email address</label>
                    </div>

                    <div class="form-floating mt-4">
                      <input type="password" name="password" id="password" class="form-control" placeholder="Password" required minlength="4"
                             pattern="[0-9a-zA-Z]{4,10}" data-label="Password"
                             data-error="Password must be 4–10 characters, using letters and numbers only.">
                      <label for="password">Password</label>
                    </div>
                    <p class="form-hint mt-2 mb-0">Use 4–10 characters: letters (a–z, A–Z) and numbers (0–9).</p>

                    <div class="form-floating mt-4">
                      <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Confirm password" required
                             data-match="password" data-label="Password confirmation">
                      <label for="confirm_password">Confirm password</label>
                    </div>

                    <button type="submit" class="btn custom-btn form-control mt-4 mb-3">
                      Create account
                    </button>

                    <p class="text-center">Already have an account? <a href="sign-in.html">Sign in</a></p>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div data-include="footer"></div>

    <script src="js/includes.js"></script>
  </body>
</html>
