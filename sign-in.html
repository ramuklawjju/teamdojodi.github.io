<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to your DoJodi Events account to review proposals, timelines and bookings for your event.">
    <meta name="author" content="DoJodi Events">
    <meta name="theme-color" content="#5100ff">

    <title>Sign In — DoJodi Events</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%235100ff'/%3E%3Ctext%20x='16'%20y='22'%20font-family='Arial,sans-serif'%20font-size='18'%20font-weight='bold'%20fill='%23fff'%20text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">

    <!-- CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/bootstrap-icons.css" rel="stylesheet">
    <link href="css/dojodi.css" rel="stylesheet">
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="preloader" role="status" aria-live="polite">
      <span class="visually-hidden">Loading…</span>
      <div class="spinner"><span class="sk-inner-circle"></span></div>
    </div>
    <div data-include="navbar"></div>

    <main id="main">
      <section class="sign-in-form section-padding">
        <div class="container">
          <div class="row">
            <div class="col-lg-8 mx-auto col-12">
              <h1 class="hero-title text-center mb-3">Welcome back</h1>
              <p class="text-center mb-5">Sign in to track your proposals, timelines and bookings.</p>

              <div class="row">
                <div class="col-lg-8 col-11 mx-auto">
                  <form role="form" novalidate data-validate
                        data-success-title="Welcome back!"
                        data-success-message="This is a demo, so you are not really signed in — but the form and its validation work.">
                    <div class="form-floating mb-4 p-0">
                      <input type="email" name="email" id="email" class="form-control" placeholder="Email address" required data-label="Email address">
                      <label for="email">Email address</label>
                    </div>

                    <div class="form-floating p-0">
                      <input type="password" name="password" id="password" class="form-control" placeholder="Password" required data-label="Password">
                      <label for="password">Password</label>
                    </div>

                    <button type="submit" class="btn custom-btn form-control mt-4 mb-3">
                      Sign in
                    </button>

                    <p class="text-center">Don't have an account? <a href="sign-up.html">Create one</a></p>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div data-include="footer"></div>

    <script src="js/includes.js"></script>
  </body>
</html>
