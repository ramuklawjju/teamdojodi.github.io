<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Get in touch with DoJodi Events to start planning your wedding, celebration or corporate event. Based in Indiranagar, Bangalore, planning across India.">
    <meta name="author" content="DoJodi Events">
    <meta name="theme-color" content="#5100ff">

    <title>Contact Us — DoJodi Events</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%235100ff'/%3E%3Ctext%20x='16'%20y='22'%20font-family='Arial,sans-serif'%20font-size='18'%20font-weight='bold'%20fill='%23fff'%20text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">

    <!-- CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/bootstrap-icons.css" rel="stylesheet">
    <link href="css/dojodi.css" rel="stylesheet">
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="preloader" role="status" aria-live="polite">
      <span class="visually-hidden">Loading…</span>
      <div class="spinner"><span class="sk-inner-circle"></span></div>
    </div>
    <div data-include="navbar"></div>

    <main id="main">
      <header class="site-header section-padding-img site-header-image">
        <div class="container">
          <div class="row">
            <div class="col-lg-6 col-12 header-info">
              <span class="eyebrow">Get in touch</span>
              <h1>
                <span class="d-block text-primary">Let's plan</span>
                <span class="d-block text-dark">something memorable</span>
              </h1>
            </div>
          </div>
        </div>

        <img src="images/header/positive-european-woman-has-break-after-work.jpg" class="header-image img-fluid" alt="A groom placing a wedding ring on the bride's finger during a church ceremony" loading="lazy">
      </header>

      <section class="contact section-padding">
        <div class="container">
          <div class="row">
            <div class="col-lg-6 col-12">
              <span class="eyebrow">Enquiries</span>
              <h2 class="mb-4">Send us a <span>message</span></h2>

              <form class="contact-form me-lg-5 pe-lg-3" novalidate data-validate
                    data-success-title="Thanks — message received!"
                    data-success-message="We'll be in touch within two working days to set up your discovery call.">
                <div class="form-floating">
                  <input type="text" name="name" id="name" class="form-control" placeholder="Full name" required data-label="Full name">
                  <label for="name">Full name</label>
                </div>

                <div class="form-floating my-4">
                  <input type="email" name="email" id="email" class="form-control" placeholder="Email address" required data-label="Email address">
                  <label for="email">Email address</label>
                </div>

                <div class="form-floating my-4">
                  <input type="text" name="subject" id="subject" class="form-control" placeholder="Subject" required data-label="Subject">
                  <label for="subject">Subject</label>
                </div>

                <div class="form-floating mb-4">
                  <textarea id="message" name="message" class="form-control" placeholder="Tell us about your event" required data-label="Your message" style="height: 160px"></textarea>
                  <label for="message">Tell us about your event</label>
                </div>

                <button type="submit" class="btn custom-btn">Send message</button>
              </form>
            </div>

            <div class="col-lg-6 col-12 mt-5 mt-lg-0">
              <div class="row">
                <div class="col-sm-6 border-end contact-info">
                  <h2 class="contact-info-title">Email us</h2>
                  <a href="mailto:hello@dojodi.com" class="custom-link">
                    hello@dojodi.com
                    <i class="bi-arrow-right ms-2" aria-hidden="true"></i>
                  </a>
                </div>

                <div class="col-sm-6 contact-info">
                  <h2 class="contact-info-title">Call us</h2>
                  <a href="tel:+918041235678" class="custom-link">
                    +91 80 4123 5678
                    <i class="bi-arrow-right ms-2" aria-hidden="true"></i>
                  </a>
                </div>

                <div class="col-sm-6 border-top border-end contact-info">
                  <h2 class="contact-info-title">Visit the studio</h2>
                  <p class="text-muted mb-0">14 100ft Road,<br>Indiranagar, Bangalore 560038</p>
                </div>

                <div class="col-sm-6 border-top contact-info">
                  <h2 class="contact-info-title">Follow along</h2>
                  <ul class="social-icon">
                    <li><a href="#" class="social-icon-link bi-instagram" aria-label="DoJodi on Instagram"></a></li>
                    <li><a href="#" class="social-icon-link bi-youtube" aria-label="DoJodi on YouTube"></a></li>
                    <li><a href="#" class="social-icon-link bi-whatsapp" aria-label="DoJodi on WhatsApp"></a></li>
                    <li><a href="#" class="social-icon-link bi-linkedin" aria-label="DoJodi on LinkedIn"></a></li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div data-include="footer"></div>

    <script src="js/includes.js"></script>
  </body>
</html>
